#   exclude_incomplete_tail 을 끈다. 그 규칙은 말단 10일의 라벨을
#   확정할 수 없다는 이유로 마지막 달을 통째로 빼는데, 창 검열
#   (censoring_scope: window) 은 어차피 모든 달의 마지막 10일을
#   버린다. 다른 달은 '다음 달 데이터가 있어도 창 밖이라 안 본다'는
#   선택이고 3월은 '데이터가 없어 못 본다'는 강제일 뿐, 정보량은 같다.
#   도시바 2026-03 은 함대 37,202대가 31일까지 정상 관측되고 고장도
#   36건으로 정상 범위(18~51)다. HGST 처럼 오염돼 있지 않다.
#
#   검증 임곗값도 월별 창으로 쪼개 풀링한다 (export_results.val_disk_rank).
#   디스크 점수가 창 안 최댓값이라, val 을 두 달 한 창으로 두면 50일
#   최댓값으로 잡은 임곗값을 20일 최댓값에 들이대게 된다.

# [보조] 음성 stride 2 판. 본 비교는 tos_select (무처리) 이고, 이것은
# stride 가 모델 순위를 바꾸는지 확인하는 대조용이다.
# 후보 모델 비교 — 도시바 10-2-6, 음성 stride 2.
#
# CNN1D 는 후보에서 뺐다. TCN 과 같은 시간축 1D 합성곱 계열인데, TCN 이
# dilation 으로 수용 영역을 지수적으로 넓히고 causal padding 을 쓰는 더
# 원칙적인 구성이다. HGST 실측에서도 TCN 이 앞섰다 (val pAUC 0.738 vs 0.713,
# test pAUC 0.709 vs 0.698). 도시바 결과를 보기 전에, 그 사전 근거로 뺐다.
#
# 학습 10개월 - 검증 2개월 - 테스트 6개월(월 단위), 재학습 없음.
# 후보 8종이 전부 같은 조건에서 돈다.
#
# 통제 조건:
#   - 원본 SMART 피처만 쓴다 (파생 전부 off). 파생변수 효과는 별도 축이다.
#   - 손실 가중 없음. 불균형은 임곗값으로만 다룬다.
#   - 시퀀스는 lookback 14일 + min-max 정규화. z-score 는 SMART 카운터의
#     긴 꼬리 때문에 입력이 [-1.95, 27.73] 까지 벌어져 RNNNet(정규화 레이어
#     없음)의 게이트를 포화시킨다. 실측에서 min-max 가 LSTM/GRU 를 크게
#     끌어올렸다.
#
# 음성 stride 2 에 대하여:
#   여덟 모델에 똑같이 적용되므로 비교는 공정하다. 실측(tos_win10_* 4판)에서
#   stride 는 성능을 깎지 않았고 (R@1% 0.704~0.736, 이항 SE 0.036 안), 학습만
#   2.6배 빨라졌다. 양성은 전량 유지되고, 시퀀스에서도 표집은 채점 대상
#   인덱스에만 걸려 lookback 창은 연속된 실제 날짜로 채워진다.
#
#   다만 이것은 계산 비용을 줄이려는 표집이지 불균형 보정이 아니다. 양성 비율이
#   0.032% -> 0.064% 로 바뀌므로, 논문에 "불균형 처리를 적용하지 않았다" 고
#   적으려면 이 문장을 손봐야 한다.

experiment: tos_select_stride2
uses:
  data: configs/data.yaml
  preprocessing: configs/preprocessing.yaml
  labeling: configs/labeling.yaml
  split: configs/split.yaml
  features: configs/features.yaml
  evaluation: configs/evaluation.yaml
drives:
- TOSHIBA_20MG07ACA14TA
models:
- configs/models/randomforest.yaml
- configs/models/xgboost.yaml
- configs/models/lightgbm.yaml
- configs/models/mlp.yaml
- configs/models/lstm.yaml
- configs/models/gru.yaml
- configs/models/tcn.yaml
seeds:
- 42
folds:
- 0
warm_start: false
overrides:
  labeling.horizon_days: 10
  labeling.censoring_scope: window
  labeling.min_history_days: 30
  features.train_sampling.strategy: stride
  models.mlp.training.loss: bce
  models.mlp.training.auto_pos_weight: false
  evaluation.disk_level.rule: in_horizon
  evaluation.disk_level.window_days: null
  evaluation.threshold.policy: fixed_disk_far
  evaluation.threshold.fixed_disk_far: 0.01
  split.protocol: forward_chaining
  split.test_months: 1
  split.val_months: 2
  split.n_folds: 6
  split.embargo_days: 0
  split.allow_label_overlap: true
  split.exclude_incomplete_tail: false
  split.min_train_months: 6
  split.min_train_failures: 1
  split.min_val_failures: 1
  split.min_test_failures: 1
  split.train_window: rolling
  split.train_months: 10
  features.train_sampling.negative_stride: 2
  features.base.include_age: false
  features.base.diff_lags: []
  features.base.rolling_windows: []
  features.base.rolling_stats: []
  features.base.include_since_start: false
  features.base.cid_windows: []
  features.base.asfd_windows: []
  features.sequence.lookback_days: 14
  features.scaling.method: minmax
  models.tcn.training.loss: bce
  models.tcn.training.auto_pos_weight: false
  models.lstm.training.loss: bce
  models.lstm.training.auto_pos_weight: false
  models.gru.training.loss: bce
  models.gru.training.auto_pos_weight: false
output_root: ${project_root}/runs
