# 표본 처리 ablation — 무작위 언더샘플링 1:200
#
#   train  2018-08-01 ~ 2025-12-31 (관측 전 구간)
#   val    2026-01
#   test   2026-02   <- 딱 한 번 예측
#
# 다른 연구들과 같은 형태다. 매달 재학습하는 운영 프로토콜이 아니라,
# 과거 전체로 모델 하나를 만들어 다음 한 달을 맞추고 그 성능을 잰다.
#
# ⚠ test 월의 고장이 14대뿐이다. 한 대 차이가 recall 7%p 이므로 모델 간
#   미세한 차이는 이 설정으로 가릴 수 없다.

experiment: samp_ratio200

uses:
  data: configs/data.yaml
  preprocessing: configs/preprocessing.yaml
  labeling: configs/labeling.yaml
  split: configs/split.yaml
  features: configs/features.yaml
  evaluation: configs/evaluation.yaml

drives: [HGST_20HUH721212ALN604]
models:
  - configs/models/lightgbm.yaml
seeds: [42]
folds: null
warm_start: false

overrides:
  split.train_window: expanding
  split.min_train_months: 1
  split.val_months: 1
  split.test_months: 1
  split.n_folds: 1
  split.embargo_days: 0
  split.allow_label_overlap: true
  split.min_train_failures: 1
  split.min_val_failures: 1
  split.min_test_failures: 1

  labeling.horizon_days: 10
  labeling.censoring_scope: window
  labeling.min_history_days: 30

  features.train_sampling.strategy: ratio
  features.train_sampling.negative_ratio: 200
  features.train_sampling.seed: 42

  evaluation.disk_level.rule: in_horizon
  evaluation.disk_level.window_days: null

  models.gru.training.epochs: 30
  models.lstm.training.epochs: 30
  models.cnn1d.training.epochs: 30
  models.tcn.training.epochs: 30
  models.transformer.training.epochs: 30

output_root: "${project_root}/runs"
