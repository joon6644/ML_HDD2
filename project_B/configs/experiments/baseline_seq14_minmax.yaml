# 시퀀스 4종 재학습 — 입력 정규화를 min-max 로 바꾼 판.
#
# baseline_seq14.yaml 과 오직 features.scaling.method 하나만 다르다.
#
# 왜 다시 도는가:
#   기본값 standard(z-score) + 0.1/99.9 절단으로는 입력 범위가 [-1.95, 27.73]
#   이 된다. SMART 카운터(197, 5, 198)가 정상 디스크에서 0 이다가 고장 직전에만
#   치솟아 오른쪽으로만 긴 꼬리가 생기기 때문이다. LSTM/GRU 는 RNNNet 에
#   정규화 레이어가 없어 이 값이 tanh·sigmoid 게이트로 그대로 들어간다.
#   (TCN/CNN1D 는 첫 합성곱 직후 BatchNorm1d 가 받아내므로 노출이 덜하다.)
#
#   실측도 이와 어긋나지 않는다 — test pAUC 가 BatchNorm 있는 쪽(CNN1D 0.705,
#   TCN 0.691)이 없는 쪽(LSTM 0.669, GRU 0.665)보다 높다.
#
#   "시퀀스 계열이 트리 모델을 넘지 못했다" 고 쓰려면 그 모델들이 제 조건에서
#   학습됐어야 한다. 통제변수를 맞추기 위한 재실행이다.
#
# 누수 없음: Scaler 는 fold 의 train 구간에서만 적합하고(runner.py), 그렇게
#   얻은 최소·최대로 val 과 test 를 변환한다. 절단 뒤의 값을 쓰므로 train 의
#   극단값 하나가 나머지를 0 근처로 뭉개지도 않는다.
#
# tcn_deep 은 뺀다. 표에 싣는 후보 8종에 들어가지 않는다.

# 모델 셀렉 확장 — 입력 윈도우를 갖는 시퀀스 계열 (lookback 14일).
#
# baseline.yaml(tabular 4종) 과 조건이 완전히 같다. 표집(strategy: none,
# 2,494만 행), 분할, 라벨, in_horizon 판정, val 에서 잡는 1% 운영점, 시드 42
# 전부 동일하다.
#
# 입력 변수도 같다. sequence.columns 가 raw_and_age 라 tabular 베이스라인과
# 똑같은 20개(smart_*_raw 18 + age 2)를 쓴다. 유일한 차이는 그 20개를
# 하루치로 보느냐(tabular) 14일치로 보느냐(sequence)다.
#
# lookback 이 창 경계를 넘는 것에 대하여:
#   load_sequence 는 행렬을 start-(lookback-1) 부터 읽고, 채점 대상은
#   in_window 로 [start, end] 만 남긴다. 2025-12-01 표본은 11-18~12-01 의
#   실제 14일을 본다. 시간축으로 뒤로만 가므로 예측 시점에 이미 관측된
#   데이터이고, 누출이 아니다.
#
#   평가 모집단도 같다. lookback 을 못 채우는 표본을 버리지 않고
#   short_history: pad 로 살린다 (L=30 실측에서 test 의 0.25% 뿐이었고,
#   그마저 창 경계가 아니라 관측 공백으로 segment 가 새로 시작된 경우다).
#
#   tabular 의 diff/rolling 파생도 피처 레이어를 전 구간에서 한 번에 만들어
#   똑같이 경계를 넘어 뒤로 간다. 두 계열이 대칭이다.
#
# lookback 은 스윕한다 (7 / 14 / 30).
#   30 이 features.yaml 에 적혀 있었지만 그것도 근거 없이 정한 값이라
#   "기본값이니 조정하지 않았다" 는 방어가 성립하지 않는다. 셋 다 임의값이다.
#   그래서 하나를 골라 Baseline 이라 부르지 않고 축으로 재서 보고한다.
#   결과를 보고 이긴 값을 Baseline 행에 넣으면 그게 결과로 고르는 것이다.

experiment: baseline_seq14_minmax

uses:
  data: configs/data.yaml
  preprocessing: configs/preprocessing.yaml
  labeling: configs/labeling.yaml
  split: configs/split.yaml
  features: configs/features.yaml
  evaluation: configs/evaluation.yaml

drives: [HGST_20HUH721212ALN604]

models:
  - configs/models/gru.yaml
  - configs/models/lstm.yaml
  - configs/models/cnn1d.yaml
  - configs/models/tcn.yaml

seeds: [42]
folds: [0]
warm_start: false

overrides:
  # --- 분할 (zoo_3month 와 동일) ---
  split.train_window: expanding
  split.min_train_months: 1
  split.val_months: 1
  split.test_months: 1
  split.n_folds: 3
  # 창을 붙여 쓴다. 라벨 누출은 labeling.censoring_scope: window 가 막는다
  # (다음 창에서 고장난 디스크의 경계 근처 행은 라벨이 확정되지 않아 빠진다).
  split.embargo_days: 0
  split.allow_label_overlap: true
  split.min_train_failures: 1
  split.min_val_failures: 1
  split.min_test_failures: 1

  # --- 라벨 (zoo_3month 와 동일) ---
  labeling.horizon_days: 10
  labeling.censoring_scope: window
  labeling.min_history_days: 30

  # --- 파생변수 없음 (SMART 원값만) ---
  # diff/rolling/since_start 를 비우고 나이 2개(age_days, segment_age_days)도
  # 뺀다. 그 둘은 SMART 원값이 아니라 record_date 에서 계산한 값이라 "원본
  # 피처만" 이라는 선언에 어긋난다. 남는 입력은 smart_*_raw 18개뿐이다.
  features.base.include_age: false
  features.base.diff_lags: []
  features.base.rolling_windows: []
  features.base.rolling_stats: []
  features.base.include_since_start: false

  # --- 입력 윈도우 ---
  # 스윕 지점. baseline_seq7 / _seq14 / _seq30 이 이 값만 다르다.
  # 실측(GPU, batch 4096, 채널 21): 4종 합계 L=30 66.1ms -> L=14 36.3ms/배치.
  features.sequence.lookback_days: 14

  # --- 이 실험의 유일한 변경점 ---
  # 절단은 그대로 두고, 그 뒤 train 최소·최대로 [0, 1] 에 넣는다.
  features.scaling.method: minmax

  # --- 불균형 처리 없음 ---
  features.train_sampling.strategy: none
  # 불균형 처리 없음 — 순수 BCE, 손실 가중 없음.
  models.tcn.training.loss: bce
  models.tcn.training.auto_pos_weight: false
  models.cnn1d.training.loss: bce
  models.cnn1d.training.auto_pos_weight: false
  models.lstm.training.loss: bce
  models.lstm.training.auto_pos_weight: false
  models.gru.training.loss: bce
  models.gru.training.auto_pos_weight: false

  # --- 판정 (zoo_3month 와 동일) ---
  evaluation.disk_level.rule: in_horizon
  evaluation.disk_level.window_days: null

  # --- 운영점 ---
  # 모델 선정 제약은 디스크 단위 오탐률 1% 하나다. val 에서만 잡는다.
  # max_f1 은 양성률 0.02% 구간에서 무너지므로 쓰지 않는다.
  evaluation.threshold.policy: fixed_disk_far
  evaluation.threshold.fixed_disk_far: 0.01

output_root: "${project_root}/runs"
