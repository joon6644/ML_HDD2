# 원본 데이터 정의.
#
# 원본(repo root의 data/raw)은 읽기 전용이다. 이 프로젝트는 원본 경로에
# 어떤 파일도 쓰지 않으며, 모든 파생 데이터는 project_B/data 아래에 만든다.

raw_root: "${repo_root}/data/raw"
derived_root: "${project_root}/data"

# enabled: true인 드라이브만 파이프라인이 처리한다.
# 확장할 때는 여기만 바꾸면 된다 (코드 수정 불필요).
drives:
  - name: HGST_20HUH721212ALN604
    file: HGST_20HUH721212ALN604.parquet
    enabled: true
  - name: ST12000NM0007
    file: ST12000NM0007.parquet
    enabled: false
    # 함대 퇴역 전까지만 사용한다. 2019-11 에 37,271대였다가 2020-06 부터
    # 줄어들어 2026-02 에는 979대뿐이다. 마지막 달을 test 로 쓰면 고장이
    # 2건이라 지표가 성립하지 않는다. 2020-05 는 36,963대(피크의 99%)이고
    # 그 달 고장이 31건이다. 자르는 기준은 함대 규모이지 성능이 아니다.
    end_date: "2020-05-31"
  - name: TOSHIBA_20MG07ACA14TA
    file: TOSHIBA_20MG07ACA14TA.parquet
    enabled: true
    # 함대 37,200대가 2026-03-31 까지 안정적으로 관측된다. HGST 와 달리 말단
    # 종료 아티팩트가 없다 (HGST 는 2026-03-21 에 관측이 끊기는데 그 달 고장률이
    # 직전 달의 4.2배로 튄다). 고장도 월 18~51 로 추세 없이 고르다.

# 원본에 반드시 있어야 하는 컬럼. 없으면 즉시 중단한다.
required_columns:
  - serial_number
  - date
  - failure

# 원본 관측 구간. manifest 검증에만 쓰이며 실제 값은 원본에서 읽는다.
expected_date_range:
  start: "2018-07-12"
  end: "2026-03-31"
