# 시간축 forward chaining split 설정.
#
# 이 프로젝트의 핵심 프로토콜이다. project_A가 serial 단위 무작위 층화분할을
# 쓴 것과 달리, 여기서는 오직 시간으로만 자른다.
#
#   "과거 데이터로 학습해서 다음 한 달을 예측한다"
#
# fold 하나의 구조:
#
#   [-------- train --------][embargo][ val ][embargo][ test ]
#                                                      1개월
#
# embargo가 필요한 이유:
#   train의 관측 시점 t는 (t, t + H] 구간의 고장 정보를 라벨로 사용한다.
#   따라서 t + H가 val/test 구간에 걸치면 학습 라벨이 평가 구간의 사건을
#   이미 본 것이 된다. embargo_days >= horizon_days 여야 이 누출이 막힌다.
#   embargo_days: null 이면 labeling.horizon_days 값을 그대로 쓴다.

protocol: forward_chaining

# test 구간 길이. 1개월 고정이 이 연구의 설정이다.
test_months: 1

# validation 구간 길이. threshold 선정과 early stopping에만 쓴다.
val_months: 1

embargo_days: null

# expanding: train 시작을 데이터 시작에 고정하고 fold마다 늘린다.
# rolling:   train 길이를 train_months로 고정하고 창을 민다.
train_window: expanding
train_months: 24 # train_window: rolling 일 때만 사용

# 최소 train 길이. 이보다 짧은 fold는 만들지 않는다.
min_train_months: 12

# 관측 종료 직전 H일은 생존을 확인할 수 없어 표본에서 빠진다. 그 구간이 걸친
# 마지막 달을 test로 쓰면 test 창이 조용히 잘린 채로 채점된다. 그 달을 뺀다.
exclude_incomplete_tail: true

# 생성할 fold 수. 데이터 뒤쪽에서부터 이 개수만큼 월을 test로 삼는다.
# null이면 가능한 모든 월을 fold로 만든다.
n_folds: 6

# fold 유효성 검사. 세 구간의 양성 표본 수 하한이다.
# 하나라도 못 맞추면 그 달을 fold에서 버린다.
#   train 양성 0 -> 학습할 신호가 없다
#   val   양성 0 -> 임곗값을 고를 수 없다
#   test  양성 0 -> TP/FN이 정의되지 않아 recall이 0/0이 된다
# 여기서 세는 값은 labeling.censoring_scope와 같은 기준을 쓴다.
min_train_failures: 1
min_val_failures: 1
min_test_failures: 1
