# Optuna 로 고른 XGBoost 하이퍼파라미터.
#   탐색: val 디스크 Recall@FAR 1% 를 5시드(42~46) 평균으로 최대화
#   선택: 평균 상위 5개 중 평균이 가장 큰 조합
#   재검증: 같은 조합을 CPU(n_jobs=8) 로 5시드(42~46) 다시 학습해 재현 확인.
#     val pAUC(FAR<=1%) 0.749±0.009, test Recall 0.668±0.019, ROC-AUC 0.969±0.004.
#     단일시드로 고른 조합(같은 CPU 경로, seed 42 하나의 부분 AUC 최대화)은
#     그 시드에서만 좋아 test 에서 + Feature 보다 낮았다(0.617 < 0.702) — 시드
#     하나로 8차원을 탐색하면 val(고장 23대) 에 과적합된다. 5시드 평균으로
#     고른 이 조합은 5개 시드 전부에서 + Feature 이상이었다.
#   test 는 탐색에 쓰지 않았다. 확정 후 따로 채점한다.
#   scripts/run_optuna.py 가 생성한다. 직접 고치지 마라.

name: xgboost_tuned
family: tabular
class: hddpred.models.trees.XGBoostModel
params:
  max_depth: 4
  learning_rate: 0.026307398380130718
  min_child_weight: 3.763495846474651
  subsample: 0.7167235888671817
  colsample_bytree: 0.9460920288352525
  reg_lambda: 0.010398926474417165
  reg_alpha: 0.5990504393955479
  gamma: 0.0012992690371871113
  n_estimators: 2000
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  n_jobs: 8
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
