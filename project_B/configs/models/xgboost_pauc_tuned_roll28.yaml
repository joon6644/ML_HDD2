# xgboost 탐색 1위 (val pAUC@FAR<=5% 0.8976, trial 41).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: xgboost_pauc_tuned_roll28
family: tabular
class: hddpred.models.trees.XGBoostModel
params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  n_jobs: 8
  n_estimators: 2000
  learning_rate: 0.0697115172900484
  max_depth: 8
  min_child_weight: 36
  subsample: 0.5010833789466009
  colsample_bytree: 0.9513588912546926
  reg_lambda: 0.09554564730505653
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
