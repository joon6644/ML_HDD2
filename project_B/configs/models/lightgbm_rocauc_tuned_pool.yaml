# lightgbm 탐색 1위 (val ROC-AUC 0.9449, trial 40).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: lightgbm_rocauc_tuned_pool
family: tabular
class: hddpred.models.trees.LightGBMModel
params:
  objective: binary
  metric: average_precision
  n_jobs: 8
  verbose: -1
  n_estimators: 3000
  learning_rate: 0.09437957745990806
  num_leaves: 48
  min_child_samples: 20
  subsample: 0.7489922318109371
  colsample_bytree: 0.6481280303898418
  reg_lambda: 6.542953133566612
  subsample_freq: 1
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
