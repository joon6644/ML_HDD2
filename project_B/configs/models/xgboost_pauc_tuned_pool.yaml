# xgboost 탐색 1위 (val pAUC@FAR<=5% 0.8948, trial 37).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: xgboost_pauc_tuned_pool
family: tabular
class: hddpred.models.trees.XGBoostModel
params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  n_jobs: 8
  n_estimators: 2000
  learning_rate: 0.01346014525229336
  max_depth: 9
  min_child_weight: 1
  subsample: 0.6754380911159957
  colsample_bytree: 0.7760525279504937
  reg_lambda: 0.24372814537094684
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
