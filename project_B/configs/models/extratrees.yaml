# 극단 랜덤 트리. RandomForest 와 같은 배깅이지만 분할점을 무작위로 골라
# 분산이 더 낮다. 결측을 그대로 처리한다.
name: extratrees
family: tabular
class: hddpred.models.sklearn_models.SklearnModel

params:
  estimator: sklearn.ensemble.ExtraTreesClassifier
  kwargs:
    n_estimators: 300
    min_samples_leaf: 20
    max_features: sqrt
    n_jobs: 8

training:
  scale_inputs: false
