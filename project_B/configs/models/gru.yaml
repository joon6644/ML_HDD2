name: gru
family: sequence
class: hddpred.models.sequence.RNNModel

params:
  cell: gru
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: false

training:
  epochs: 30
  batch_size: 512
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  # 손실. 설명은 configs/models/lstm.yaml 참고.
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.25
  auto_pos_weight: false
  early_stopping_patience: 5
  early_stopping_metric: val_pr_auc
  grad_clip: 1.0
  num_workers: 0
  amp: true
