# mlp 탐색 1위 (val pAUC@FAR<=5% 0.8927, trial 23).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: mlp_pauc_tuned
family: tabular
class: hddpred.models.mlp.MLPModel
params:
  batch_norm: true
  hidden_dims:
  - 256
  - 128
  dropout: 0.269598212660435
training:
  epochs: 30
  loss: bce
  auto_pos_weight: false
  early_stopping_patience: 5
  early_stopping_metric: val_pauc
  scaling:
    method: standard
    clip_quantile:
    - 0.001
    - 0.999
  learning_rate: 0.006228640135696529
  weight_decay: 0.0008052564293305779
  batch_size: 2048.0
