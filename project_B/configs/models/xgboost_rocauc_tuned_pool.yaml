# xgboost 탐색 1위 (val ROC-AUC 0.9440, trial 7).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: xgboost_rocauc_tuned_pool
family: tabular
class: hddpred.models.trees.XGBoostModel
params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  n_jobs: 8
  n_estimators: 2000
  learning_rate: 0.10727187395229411
  max_depth: 3
  min_child_weight: 11
  subsample: 0.8353189348090797
  colsample_bytree: 0.6051912805369204
  reg_lambda: 0.0032787264983352763
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
