# lightgbm 탐색 1위 (val pAUC@FAR<=5% 0.8962, trial 40).
# scripts/run_optuna_tabular.py 가 생성한다. 손으로 고치지 말 것.

name: lightgbm_pauc_tuned_roll28
family: tabular
class: hddpred.models.trees.LightGBMModel
params:
  objective: binary
  metric: average_precision
  n_jobs: 8
  verbose: -1
  n_estimators: 3000
  learning_rate: 0.010167614791948802
  num_leaves: 15
  min_child_samples: 11
  subsample: 0.6630588278966341
  colsample_bytree: 0.7572587806500343
  reg_lambda: 6.0209029665716285
  subsample_freq: 1
training:
  early_stopping_rounds: 100
  auto_scale_pos_weight: false
