name: xgboost
family: tabular
class: hddpred.models.trees.XGBoostModel

params:
  n_estimators: 2000
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0
  objective: "binary:logistic"
  eval_metric: "aucpr"
  tree_method: "hist"
  n_jobs: 8

training:
  early_stopping_rounds: 100
  # scale_pos_weight = 음성/양성 이라 양성률 0.014% 구간에서 7,000배가 나온다.
  # 그러면 raw score 가 커져 sigmoid 가 1.0 으로 포화되고 임곗값 선택이
  # 무의미해진다 (lightgbm 실측으로 확인). 불균형은 임곗값으로 다룬다.
  auto_scale_pos_weight: false
