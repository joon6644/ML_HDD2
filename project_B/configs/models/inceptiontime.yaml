# InceptionTime. 커널 크기를 병렬로 두어 여러 시간 척도를 본다.
# SMART 는 급변(재할당 섹터 점프)과 완만한 추세(온도)가 섞여 있다.
name: inceptiontime
family: sequence
class: hddpred.models.sequence.InceptionTimeModel

params:
  depth: 6
  filters: 32

training:
  epochs: 30
  batch_size: 512
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.25
  auto_pos_weight: false
  early_stopping_patience: 5
  early_stopping_metric: val_pr_auc
  grad_clip: 1.0
  num_workers: 0
  amp: true
